version: 2

models:
  - name: stg_products
    description: "Product master data, cast and renamed. One row per product."
    columns:
      - name: product_id
        description: "Primary key. Format P0001."
        tests: [unique, not_null]
      - name: ean
        description: "13-digit EAN barcode. Join key to competitor prices."
        tests: [unique, not_null]
      - name: category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bier', 'Wasser', 'Softdrinks', 'Saft', 'Wein', 'Spirituosen']
      - name: unit_cost_eur
        tests: [not_null]

  - name: stg_stores
    description: "Store master data. One row per store."
    columns:
      - name: store_id
        tests: [unique, not_null]
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: ['Berlin', 'Brandenburg']
      - name: store_format
        tests:
          - accepted_values:
              arguments:
                values: ['Kompakt', 'Standard', 'XL']

  - name: stg_price_history
    description: "List price validity periods. Source for the SCD2 snapshot."
    columns:
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                 to: ref('stg_products')
                 field: product_id
      - name: list_price_eur
        tests: [not_null]
      - name: valid_from
        tests: [not_null]

  - name: stg_promotions
    description: "Promotion periods with discount percentage."
    columns:
      - name: promo_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                 to: ref('stg_products')
                 field: product_id
      - name: discount_pct
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [10, 15, 20, 25]
                quote: false

  - name: stg_pos_sales
    description: "Daily POS sales. One row per store, product and day. unit_price is net of discount."
    columns:
      - name: sale_date
        tests: [not_null]
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                 to: ref('stg_stores')
                 field: store_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                 to: ref('stg_products')
                 field: product_id
      - name: units_sold
        tests: [not_null]
      - name: revenue_eur
        tests: [not_null]

  - name: stg_competitor_prices
    description: "Competitor observations flattened from JSON. Joins to products on EAN, not product_id."
    columns:
      - name: ean
        tests: [not_null]
      - name: competitor_price_eur
        tests: [not_null]
      - name: observed_at
        tests: [not_null]

  - name: stg_weather
    description: "Daily Berlin weather. One row per day, 730 days."
    columns:
      - name: weather_date
        tests: [unique, not_null]
      - name: temp_max_c
        tests: [not_null]